name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Create local.properties and Inject Secrets
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Create .env from .env.example
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # If the user has configured global app keys as secrets, inject them
          if [ ! -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            # Replace placeholder with actual secret
            sed -i "s|GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|g" .env
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Execute Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Decode Signing Keystores
        run: |
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > my-upload-key.jks || base64 -d debug.keystore.base64 > my-upload-key.jks || true
            cp my-upload-key.jks debug.keystore || true
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          # Build a debug test APK
          ./gradlew assembleDebug --stacktrace
          
          # Always assemble the Release APK signed using the decoded private key
          ./gradlew assembleRelease --stacktrace

      - name: Archive Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfseek-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Archive Release APK
        if: success() && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wfseek-release-apk
          path: app/build/outputs/apk/release/app-release.apk
